<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상식 종합 챌린지</title>
<style>
  :root { --orange:#ff8a24; --deep:#e96b0c; --ink:#242424; --muted:#707070; --paper:#fffaf4; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; padding:28px 16px; display:grid; place-items:center;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink);
    background:linear-gradient(145deg,#ffb45c 0%,#ff8a24 48%,#f36b18 100%);
  }
  .app { width:min(100%,620px); background:var(--paper); border-radius:26px; padding:clamp(22px,5vw,38px);
    box-shadow:0 22px 60px #8a390b40; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
  .tag { background:#ffead7; color:#a64b08; border-radius:999px; padding:7px 12px; font-size:12px; font-weight:800; }
  .count { color:var(--muted); font-size:13px; font-weight:700; }
  h1 { font-size:clamp(25px,5vw,34px); margin:0 0 8px; letter-spacing:-1px; }
  .sub { margin:0 0 24px; color:var(--muted); font-size:14px; }
  .progress { height:8px; background:#f0e4d8; border-radius:20px; overflow:hidden; margin-bottom:26px; }
  .bar { height:100%; width:0; background:linear-gradient(90deg,#ffb04d,#f07818); transition:width .25s; }
  .question { font-size:clamp(19px,4vw,23px); line-height:1.5; font-weight:800; margin:0 0 20px; }
  .options { display:grid; gap:11px; }
  button { font:inherit; cursor:pointer; }
  .option { text-align:left; border:2px solid #eee0d3; border-radius:15px; background:white; padding:15px 16px;
    display:flex; align-items:center; gap:12px; transition:.15s; color:var(--ink); }
  .option:hover:not(:disabled) { border-color:var(--orange); transform:translateY(-1px); background:#fff8f0; }
  .option:disabled { cursor:default; opacity:1; }
  .letter { width:30px; height:30px; flex:0 0 30px; border-radius:10px; display:grid; place-items:center;
    background:#fff0e1; color:#b9580b; font-weight:900; }
  .option.correct { border-color:#36a66b; background:#effaf3; }
  .option.correct .letter { background:#d7f3e2; color:#187544; }
  .option.wrong { border-color:#df6868; background:#fff1f1; }
  .option.wrong .letter { background:#ffe0e0; color:#b52e2e; }
  .feedback { margin-top:17px; padding:14px 16px; border-radius:14px; background:#f3eee8; line-height:1.55; font-size:14px; display:none; }
  .feedback.show { display:block; }
  .actions { display:flex; justify-content:flex-end; margin-top:20px; }
  .primary { border:0; border-radius:13px; padding:13px 21px; background:var(--deep); color:white; font-weight:800; }
  .primary:hover { background:#ce5908; }
  .primary:disabled { opacity:.4; cursor:not-allowed; }
  .result { text-align:center; padding:10px 0 4px; }
  .score { font-size:58px; font-weight:900; color:var(--deep); letter-spacing:-2px; margin:18px 0 5px; }
  .result p { color:var(--muted); line-height:1.6; }
  .review { text-align:left; margin:22px 0; padding:16px; background:white; border:1px solid #eee0d3; border-radius:15px; }
  .review div { padding:9px 0; border-bottom:1px solid #f0e9e2; font-size:14px; }
  .review div:last-child { border:0; }
  .small { color:var(--muted); font-size:12px; margin-top:20px; text-align:center; }
  @media(max-width:420px){ body{padding:12px;} .app{border-radius:20px;} .option{padding:13px;} }
</style>
</head>
<body>
<main class="app">
  <div class="top"><span class="tag">🧠 종합상식 · 중상급</span><span class="count" id="count">1 / 5</span></div>
  <h1>상식 종합 챌린지</h1>
  <p class="sub">과학부터 역사까지, 다섯 문제에 도전해 보세요!</p>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <section id="quiz">
    <h2 class="question" id="question"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="actions"><button class="primary" id="next" disabled>다음 문제 →</button></div>
  </section>
  <section class="result" id="result" hidden></section>
  <p class="small">정답을 선택하면 해설이 표시됩니다.</p>
</main>
<script>
const questions = [
 {q:"지구 대기에서 부피 기준으로 가장 많은 비율을 차지하는 기체는?",a:["산소","질소","이산화탄소","아르곤"],c:1,e:["산소는 대기의 약 21%를 차지합니다.","질소는 대기의 약 78%로 가장 큰 비율입니다.","이산화탄소는 대기 중 극히 일부입니다.","아르곤은 약 0.93%를 차지합니다."],h:"우리가 숨 쉴 때 필요한 산소보다 훨씬 많은 기체입니다."},
 {q:"구텐베르크의 금속 활자 인쇄술이 유럽에서 등장한 시기는?",a:["11세기","13세기","15세기","17세기"],c:2,e:["유럽의 구텐베르크 인쇄술보다 약 300년 앞선 시기입니다.","구텐베르크의 인쇄술은 이보다 뒤에 등장했습니다.","구텐베르크는 15세기 중반 유럽에서 금속 활자 인쇄술을 발전시켰습니다.","유럽의 금속 활자 인쇄술은 이보다 훨씬 일찍 등장했습니다."],h:"르네상스가 확산되던 시기를 떠올려 보세요."},
 {q:"빛이 진공에서 1초 동안 이동하는 거리에 가장 가까운 것은?",a:["약 30만 km","약 3만 km","약 300만 km","약 3천 km"],c:0,e:["빛의 속력은 진공에서 약 299,792km/s입니다.","실제 빛의 속력보다 약 10배 작습니다.","실제 빛의 속력보다 약 10배 큽니다.","빛의 속력은 이보다 훨씬 빠릅니다."],h:"빛의 속력은 초속 약 30만이라는 유명한 근삿값으로 기억됩니다."},
 {q:"다음 중 포유류가 아닌 동물은?",a:["박쥐","고래","펭귄","돌고래"],c:2,e:["박쥐는 털과 젖샘을 가진 포유류입니다.","고래는 물속에 살지만 포유류입니다.","펭귄은 알을 낳는 조류입니다.","돌고래는 폐로 호흡하는 포유류입니다."],h:"날개가 있지만 하늘을 날지 못하는 동물입니다."},
 {q:"정육면체의 면은 모두 몇 개인가?",a:["4개","6개","8개","12개"],c:1,e:["4개는 정사면체의 면 개수입니다.","정육면체는 정사각형 모양의 면 6개로 이루어집니다.","8개는 정육면체의 꼭짓점 개수입니다.","12개는 정육면체의 모서리 개수입니다."],h:"주사위의 바깥쪽 면을 하나씩 세어 보세요."}
];
let index=0, score=0, chosen=false, results=[];
const $=id=>document.getElementById(id);
function render(){
 const item=questions[index]; chosen=false;
 $("count").textContent=`${index+1} / ${questions.length}`;
 $("bar").style.width=`${index/questions.length*100}%`;
 $("question").textContent=item.q;
 $("options").innerHTML="";
 $("feedback").className="feedback"; $("feedback").textContent="";
 $("next").disabled=true; $("next").textContent=index===questions.length-1?"결과 보기":"다음 문제 →";
 item.a.forEach((label,i)=>{
   const b=document.createElement("button"); b.className="option";
   b.innerHTML=`<span class="letter">${"ABCD"[i]}</span><span>${label}</span>`;
   b.addEventListener("click",()=>answer(i)); $("options").appendChild(b);
 });
}
function answer(i){
 if(chosen)return; chosen=true;
 const item=questions[index], buttons=[...$("options").children], ok=i===item.c;
 if(ok)score++;
 results.push({q:item.q, picked:item.a[i], correct:item.a[item.c], ok});
 buttons.forEach((b,n)=>{b.disabled=true;if(n===item.c)b.classList.add("correct");if(n===i&&!ok)b.classList.add("wrong");});
 $("feedback").textContent=(ok?"정답이에요! ":"아쉽지만 오답이에요. ")+item.e[i]+(ok?"":" 정답: "+item.a[item.c]);
 $("feedback").classList.add("show"); $("next").disabled=false;
}
$("next").addEventListener("click",()=>{
 if(index<questions.length-1){index++;render();}else finish();
});
function finish(){
 $("quiz").hidden=true; $("count").textContent="완료"; $("bar").style.width="100%";
 const msg=score===5?"완벽해요! 상식 고수네요.":score>=3?"좋아요! 꽤 잘 알고 있어요.":"다시 도전하면 더 잘할 수 있어요!";
 $("result").hidden=false;
 $("result").innerHTML=`<h2>퀴즈 완료!</h2><div class="score">${score} / ${questions.length}</div><p>${msg}</p><div class="review">${results.map((r,i)=>`<div><strong>${i+1}. ${r.ok?"✅":"❌"} ${r.q}</strong><br><span style="color:#777">내 답: ${r.picked}</span><br><span>정답: ${r.correct}</span></div>`).join("")}</div><button class="primary" id="restart">다시 도전하기 ↻</button>`;
 $("restart").addEventListener("click",()=>{index=0;score=0;results=[];$("quiz").hidden=false;$("result").hidden=true;render();});
}
render();
</script>
</body>
</html>
