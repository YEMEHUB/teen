<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>콩콩이의 냠냠 식단 일기 · 청소년 식단 설계</title>
  <style>
    :root {
      --bg: #fff8fb;
      --card: #ffffff;
      --pink: #ff7eb6;
      --pink-dark: #e25595;
      --pink-soft: #ffeaf3;
      --mint: #5cc8a1;
      --mint-soft: #e6fbf3;
      --peach-soft: #fff1e6;
      --warn-bg: #fff0f3;
      --warn-border: #ffc2d1;
      --warn-text: #c9184a;
      --ok-bg: #e7f9f1;
      --ok-border: #9be7c4;
      --ok-text: #157347;
      --text: #362933;
      --muted: #7c6977;
      --border: #f5dce8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #fff0f6 0%, #fff8fb 45%, #f3fcf8 100%);
      color: var(--text);
      line-height: 1.55;
      padding: 24px 16px 64px;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    /* 캐릭터 헤더 */
    .hero-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 26px;
      padding: 22px 24px;
      margin-bottom: 22px;
      box-shadow: 0 10px 26px rgba(255, 126, 182, 0.12);
      display: flex;
      align-items: center;
      gap: 20px;
    }

    @media (max-width: 680px) {
      .hero-card {
        flex-direction: column;
        text-align: center;
      }
    }

    .char-box {
      flex-shrink: 0;
      width: 112px;
      height: 112px;
      border-radius: 28px;
      background: linear-gradient(160deg, #ffeaf3 0%, #e7fbf3 100%);
      border: 2px solid #ffd6e7;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floaty 2.8s ease-in-out infinite;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .pill {
      display: inline-block;
      background: var(--pink-soft);
      color: var(--pink-dark);
      font-weight: 800;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .speech-bubble {
      background: var(--peach-soft);
      border: 1.5px solid #ffd8be;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text);
      margin-top: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 20px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(245, 220, 232, 0.45);
    }

    .card h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    input, select, button {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(255, 126, 182, 0.18);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      background: linear-gradient(135deg, var(--pink), #ff9ebb);
      color: #fff;
      border: none;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    button:hover {
      filter: brightness(0.97);
      transform: translateY(-1px);
    }

    .btn-soft {
      background: var(--mint-soft);
      color: var(--ok-text);
      border: 1.5px solid var(--ok-border);
      margin-top: 8px;
    }

    .btn-soft:hover {
      background: #d5f6e8;
    }

    .alert-box {
      padding: 14px 16px;
      border-radius: 16px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 700;
    }

    .alert-warn {
      background: var(--warn-bg);
      border: 1.5px solid var(--warn-border);
      color: var(--warn-text);
    }

    .alert-ok {
      background: var(--ok-bg);
      border: 1.5px solid var(--ok-border);
      color: var(--ok-text);
    }

    .meal-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .meal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #fff9fc;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
    }

    .meal-time {
      display: inline-block;
      background: var(--pink-soft);
      color: var(--pink-dark);
      font-weight: 800;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      margin-right: 6px;
    }

    .meal-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .del-btn {
      width: auto;
      padding: 6px 11px;
      font-size: 12px;
      border-radius: 10px;
      background: #ffe5ec;
      color: #c9184a;
    }

    .nutrient-row {
      margin-bottom: 14px;
    }

    .nutrient-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .bar-bg {
      width: 100%;
      height: 12px;
      background: #fceef4;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #5cc8a1, #7ce0bc);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .bar-fill.low {
      background: linear-gradient(90deg, #ff7eb6, #ffb3c6);
    }

    .rec-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .rec-card {
      background: #fff9fc;
      border: 1.5px solid #ffd6e7;
      border-radius: 18px;
      padding: 13px;
    }

    .rec-card strong {
      display: block;
      font-size: 14px;
      color: var(--pink-dark);
      margin-bottom: 4px;
    }

    .rec-card span {
      font-size: 12px;
      color: var(--text);
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 귀여운 마스코트 캐릭터 '콩콩이' -->
    <header class="hero-card">
      <div class="char-box" aria-hidden="true">
        <svg id="kongCharacter" width="86" height="86" viewBox="0 0 100 100">
          <!-- 새싹 잎 -->
          <path d="M50 22 C44 10, 28 10, 26 22 C36 25, 44 24, 50 22 Z" fill="#5cc8a1" stroke="#2d7a5e" stroke-width="2.5"/>
          <path d="M50 22 C56 10, 72 10, 74 22 C64 25, 56 24, 50 22 Z" fill="#7ce0bc" stroke="#2d7a5e" stroke-width="2.5"/>
          <line x1="50" y1="22" x2="50" y2="30" stroke="#2d7a5e" stroke-width="3" stroke-linecap="round"/>

          <!-- 둥근 얼굴 -->
          <ellipse cx="50" cy="58" rx="33" ry="29" fill="#ffe5ec" stroke="#ff7eb6" stroke-width="3"/>

          <!-- 볼터치 -->
          <ellipse cx="30" cy="63" rx="6" ry="3.8" fill="#ff9ebb" opacity="0.85"/>
          <ellipse cx="70" cy="63" rx="6" ry="3.8" fill="#ff9ebb" opacity="0.85"/>

          <!-- 눈 (상태에 따라 변경됨) -->
          <g id="charEyes">
            <circle cx="38" cy="55" r="4.2" fill="#362933"/>
            <circle cx="62" cy="55" r="4.2" fill="#362933"/>
            <circle cx="36.7" cy="53.6" r="1.5" fill="#fff"/>
            <circle cx="60.7" cy="53.6" r="1.5" fill="#fff"/>
          </g>

          <!-- 입 (상태에 따라 변경됨) -->
          <path id="charMouth" d="M44 65 Q50 71 56 65" fill="none" stroke="#362933" stroke-width="2.8" stroke-linecap="round"/>
        </svg>
      </div>

      <div>
        <span class="pill">콩콩이의 냠냠 식단 일기 · 귀여운 버전</span>
        <h1>오늘도 쑥쑥 자라는 건강한 식단 설계</h1>
        <div id="charSpeech" class="speech-bubble">
          안녕! 나는 식단 도우미 <strong>콩콩이</strong>야. 먹은 음식과 식사 시간을 적으면 영양소를 쏙쏙 분석해 줄게!
        </div>
      </div>
    </header>

    <div class="grid">
      <!-- 왼쪽: ① 식단 기록 & 결과 하루 식단 -->
      <div>
        <section class="card">
          <h2>① 식단 기록 ✏️</h2>
          <form id="mealForm">
            <div class="row-2">
              <div class="form-group">
                <label for="mealTime">식사 시간</label>
                <input type="time" id="mealTime" value="12:30" required />
              </div>
              <div class="form-group">
                <label for="mealType">식사 구분</label>
                <select id="mealType">
                  <option value="아침">아침</option>
                  <option value="점심" selected>점심</option>
                  <option value="저녁">저녁</option>
                  <option value="간식">간식</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="foodSelect">먹은 음식 선택</label>
              <select id="foodSelect"></select>
            </div>

            <div class="form-group">
              <label for="servings">섭취량 (인분)</label>
              <input type="number" id="servings" step="0.5" min="0.5" max="5" value="1" required />
            </div>

            <button type="submit">식단 기록하기 🍓</button>
            <button type="button" class="btn-soft" id="sampleBtn">균형 잡힌 하루 예시 채우기 ✨</button>
          </form>
        </section>

        <section class="card">
          <h2>결과 · 하루 식단 🍽️</h2>
          <ul id="mealList" class="meal-list"></ul>
        </section>
      </div>

      <!-- 오른쪽: ② 영양소 분석 & ③ 균형잡힌 식단 추천 -->
      <div>
        <section class="card">
          <h2>결과 · ② 영양소 분석 📊</h2>
          <div id="statusAlert" class="alert-box alert-warn"></div>
          <div id="nutrientBars"></div>
        </section>

        <section class="card">
          <h2>③ 균형잡힌 식단 추천 🥗</h2>
          <p id="recIntro" class="meal-meta"></p>
          <div id="recCards" class="rec-list"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    const FOODS = {
      "흰쌀밥": { emoji: "🍚", kcal: 300, carbs: 66, protein: 5, fat: 0.6, fiber: 1.0, calcium: 10 },
      "잡곡밥": { emoji: "🌾", kcal: 310, carbs: 62, protein: 7, fat: 1.5, fiber: 4.5, calcium: 20 },
      "닭가슴살 샐러드": { emoji: "🥗", kcal: 260, carbs: 14, protein: 32, fat: 7, fiber: 5.0, calcium: 65 },
      "계란말이(2개)": { emoji: "🍳", kcal: 210, carbs: 2, protein: 13, fat: 16, fiber: 0, calcium: 60 },
      "두부조림": { emoji: "🧈", kcal: 190, carbs: 8, protein: 15, fat: 10, fiber: 2.5, calcium: 180 },
      "고등어구이": { emoji: "🐟", kcal: 280, carbs: 0, protein: 24, fat: 19, fiber: 0, calcium: 45 },
      "우유(200ml)": { emoji: "🥛", kcal: 130, carbs: 10, protein: 6, fat: 7, fiber: 0, calcium: 220 },
      "요거트 & 블루베리": { emoji: "🫐", kcal: 150, carbs: 20, protein: 6, fat: 4, fiber: 3.0, calcium: 150 },
      "바나나(1개)": { emoji: "🍌", kcal: 105, carbs: 27, protein: 1.3, fat: 0.4, fiber: 3.1, calcium: 6 },
      "라면(1봉)": { emoji: "🍜", kcal: 500, carbs: 78, protein: 10, fat: 16, fiber: 2.0, calcium: 35 },
      "치킨(3조각)": { emoji: "🍗", kcal: 540, carbs: 24, protein: 34, fat: 34, fiber: 1.0, calcium: 40 }
    };

    const GOALS = {
      kcal: { label: "열량", target: 2300, unit: "kcal" },
      carbs: { label: "탄수화물", target: 300, unit: "g" },
      protein: { label: "단백질", target: 65, unit: "g" },
      fat: { label: "지방", target: 65, unit: "g" },
      fiber: { label: "식이섬유", target: 25, unit: "g" },
      calcium: { label: "칼슘", target: 850, unit: "mg" }
    };

    const RECOMMENDATIONS = {
      kcal: { title: "🌾 잡곡밥 + 🧈 두부조림", desc: "건강한 열량과 든든한 영양을 함께 채워요!" },
      carbs: { title: "🌾 잡곡밥 / 🍌 바나나", desc: "학교생활 에너지를 내는 탄수화물을 보충해요." },
      protein: { title: "🥗 닭가슴살 샐러드 / 🍳 계란말이", desc: "성장기 근육과 몸을 튼튼하게 만드는 단백질!" },
      fat: { title: "🐟 고등어구이 / 🥛 우유", desc: "좋은 지방과 영양소 흡수를 도와주는 조합이에요." },
      fiber: { title: "🫐 요거트 & 블루베리 / 🌾 잡곡밥", desc: "장 건강과 포만감에 좋은 식이섬유를 쏙쏙!" },
      calcium: { title: "🥛 우유(200ml) / 🧈 두부조림", desc: "쑥쑥 키 크는 데 꼭 필요한 칼슘을 채워요!" }
    };

    let meals = [
      { id: 1, time: "07:40", type: "아침", food: "흰쌀밥", servings: 1 },
      { id: 2, time: "12:20", type: "점심", food: "라면(1봉)", servings: 1 }
    ];

    const foodSelect = document.getElementById("foodSelect");
    const mealForm = document.getElementById("mealForm");
    const mealList = document.getElementById("mealList");
    const nutrientBars = document.getElementById("nutrientBars");
    const statusAlert = document.getElementById("statusAlert");
    const recIntro = document.getElementById("recIntro");
    const recCards = document.getElementById("recCards");
    const sampleBtn = document.getElementById("sampleBtn");
    const charEyes = document.getElementById("charEyes");
    const charMouth = document.getElementById("charMouth");
    const charSpeech = document.getElementById("charSpeech");

    Object.entries(FOODS).forEach(([name, f]) => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = `${f.emoji} ${name} (${f.kcal}kcal · 단백질 ${f.protein}g)`;
      foodSelect.appendChild(opt);
    });

    function setCharacterMood(isDeficient, deficientNames) {
      if (isDeficient) {
        charEyes.innerHTML = `
          <circle cx="38" cy="55" r="4.2" fill="#362933"/>
          <circle cx="62" cy="55" r="4.2" fill="#362933"/>
          <circle cx="36.7" cy="53.6" r="1.5" fill="#fff"/>
          <circle cx="60.7" cy="53.6" r="1.5" fill="#fff"/>
        `;
        charMouth.setAttribute("d", "M45 68 Q50 63 55 68");
        charSpeech.innerHTML = `콩콩이가 살펴봤어! 지금 <strong>${deficientNames}</strong> 영양소가 부족한 상태야. 아래 추천 음식으로 균형을 맞춰보자!`;
      } else {
        charEyes.innerHTML = `
          <path d="M33 55 Q38 49 43 55" fill="none" stroke="#362933" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M57 55 Q62 49 67 55" fill="none" stroke="#362933" stroke-width="2.8" stroke-linecap="round"/>
        `;
        charMouth.setAttribute("d", "M43 64 Q50 73 57 64 Z");
        charMouth.setAttribute("fill", "#ff7eb6");
        charSpeech.innerHTML = `와아! 오늘 식단 영양 균형이 정말 멋져! 콩콩이도 기분이 날아갈 것 같아 ✨`;
      }
    }

    function calculateTotals() {
      const totals = { kcal: 0, carbs: 0, protein: 0, fat: 0, fiber: 0, calcium: 0 };
      meals.forEach((m) => {
        const f = FOODS[m.food];
        if (!f) return;
        totals.kcal += f.kcal * m.servings;
        totals.carbs += f.carbs * m.servings;
        totals.protein += f.protein * m.servings;
        totals.fat += f.fat * m.servings;
        totals.fiber += f.fiber * m.servings;
        totals.calcium += f.calcium * m.servings;
      });
      return totals;
    }

    function renderMeals() {
      const sorted = [...meals].sort((a, b) => a.time.localeCompare(b.time));
      if (sorted.length === 0) {
        mealList.innerHTML = `<li class="empty">아직 기록된 식단이 없어요. 먹은 음식과 시간을 입력해 주세요!</li>`;
        return;
      }
      mealList.innerHTML = sorted
        .map((m) => {
          const f = FOODS[m.food];
          const kcal = Math.round(f.kcal * m.servings);
          return `
            <li class="meal-item">
              <div>
                <div>
                  <span class="meal-time">${m.time} · ${m.type}</span>
                  <strong>${f.emoji} ${m.food}</strong> × ${m.servings}인분
                </div>
                <div class="meal-meta">
                  ${kcal} kcal · 탄수화물 ${(f.carbs * m.servings).toFixed(1)}g · 단백질 ${(f.protein * m.servings).toFixed(1)}g · 칼슘 ${Math.round(f.calcium * m.servings)}mg
                </div>
              </div>
              <button class="del-btn" onclick="deleteMeal(${m.id})">삭제</button>
            </li>
          `;
        })
        .join("");
    }

    function renderAnalysisAndRecommendations() {
      const totals = calculateTotals();
      const deficientKeys = [];

      nutrientBars.innerHTML = Object.entries(GOALS)
        .map(([key, goal]) => {
          const current = totals[key];
          const ratio = goal.target > 0 ? Math.min(100, Math.round((current / goal.target) * 100)) : 0;
          const isLow = current < goal.target * 0.75;
          if (isLow) deficientKeys.push(key);

          const displayVal = key === "kcal" || key === "calcium" ? Math.round(current) : current.toFixed(1);
          return `
            <div class="nutrient-row">
              <div class="nutrient-header">
                <span><strong>${goal.label}</strong> ${isLow ? "🩷 부족" : "💚 든든"}</span>
                <span>${displayVal} / ${goal.target} ${goal.unit} (${ratio}%)</span>
              </div>
              <div class="bar-bg">
                <div class="bar-fill ${isLow ? "low" : ""}" style="width: ${ratio}%"></div>
              </div>
            </div>
          `;
        })
        .join("");

      if (deficientKeys.length > 0) {
        const names = deficientKeys.map((k) => GOALS[k].label).join(", ");
        statusAlert.className = "alert-box alert-warn";
        statusAlert.textContent = `영양소가 부족한 상태입니다. 균형잡힌 음식을 추천합니다. (부족: ${names})`;

        setCharacterMood(true, names);

        recIntro.textContent = `${names}을(를) 채워 줄 콩콩이의 추천 메뉴예요!`;
        recCards.innerHTML = deficientKeys
          .slice(0, 4)
          .map((key) => {
            const rec = RECOMMENDATIONS[key];
            return `
              <div class="rec-card">
                <strong>${rec.title}</strong>
                <span>${rec.desc}</span>
              </div>
            `;
          })
          .join("");
      } else {
        statusAlert.className = "alert-box alert-ok";
        statusAlert.textContent = "오늘 하루 주요 영양소가 고르게 잘 채워졌어요! 🎉";

        setCharacterMood(false, "");

        recIntro.textContent = "현재 균형이 아주 좋아요! 아래 조합으로 건강 습관을 이어가 보세요.";
        recCards.innerHTML = `
          <div class="rec-card">
            <strong>🌾 잡곡밥 + 🐟 고등어구이 + 🥛 우유</strong>
            <span>성장기 균형 유지용 베스트 조합</span>
          </div>
        `;
      }
    }

    window.deleteMeal = function (id) {
      meals = meals.filter((m) => m.id !== id);
      renderAll();
    };

    mealForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const time = document.getElementById("mealTime").value;
      const type = document.getElementById("mealType").value;
      const food = foodSelect.value;
      const servings = parseFloat(document.getElementById("servings").value) || 1;

      meals.push({ id: Date.now(), time, type, food, servings });
      renderAll();
    });

    sampleBtn.addEventListener("click", () => {
      meals = [
        { id: 101, time: "07:30", type: "아침", food: "잡곡밥", servings: 1 },
        { id: 102, time: "07:45", type: "아침", food: "계란말이(2개)", servings: 1 },
        { id: 103, time: "12:30", type: "점심", food: "닭가슴살 샐러드", servings: 1 },
        { id: 104, time: "16:30", type: "간식", food: "우유(200ml)", servings: 1.5 },
        { id: 105, time: "19:00", type: "저녁", food: "고등어구이", servings: 1 }
      ];
      renderAll();
    });

    function renderAll() {
      renderMeals();
      renderAnalysisAndRecommendations();
    }

    renderAll();
  </script>
</body>
</html>
