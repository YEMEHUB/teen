<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다이어트 트래커 대시보드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- 상단 네비게이션 바 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-emerald-500 text-white p-2 rounded-xl shadow-md shadow-emerald-200">
                    <i class="fa-solid fa-leaf text-xl"></i>
                </div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">SlimLife</h1>
            </div>
            <div class="flex items-center space-x-3">
                <span id="current-date" class="text-sm font-medium text-slate-500"></span>
                <button onclick="resetData()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg transition font-medium">
                    <i class="fa-solid fa-rotate-right mr-1"></i> 초기화
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

        <!-- 칼로리 요약 카드 -->
        <section class="bg-gradient-to-br from-emerald-500 to-teal-600 text-white p-6 rounded-3xl shadow-xl shadow-emerald-100 relative overflow-hidden">
            <div class="absolute right-0 top-0 translate-x-6 -translate-y-6 w-48 h-48 bg-white/10 rounded-full pointer-events-none"></div>
            <div class="flex justify-between items-start mb-6">
                <div>
                    <p class="text-emerald-100 text-sm font-medium">오늘의 칼로리 목표</p>
                    <h2 class="text-3xl font-bold mt-1"><span id="total-consumed">0</span> <span class="text-lg font-normal text-emerald-100">/ <span id="goal-calories">2000</span> kcal</span></h2>
                </div>
                <button onclick="openGoalModal()" class="bg-white/20 hover:bg-white/30 backdrop-blur-md px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                    목표 설정
                </button>
            </div>

            <!-- 프로그레스 바 -->
            <div class="w-full bg-black/20 rounded-full h-3 mb-4 overflow-hidden">
                <div id="calorie-progress" class="bg-white h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-white/20 text-center">
                <div>
                    <p class="text-xs text-emerald-100">권장 섭취</p>
                    <p id="stat-goal" class="font-bold text-lg">2000</p>
                </div>
                <div>
                    <p class="text-xs text-emerald-100">섭취함</p>
                    <p id="stat-consumed" class="font-bold text-lg">0</p>
                </div>
                <div>
                    <p class="text-xs text-emerald-100">남은 칼로리</p>
                    <p id="stat-remaining" class="font-bold text-lg">2000</p>
                </div>
            </div>
        </section>

        <!-- 유틸리티 그리드 (수분 섭취 & 체중 기록) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 수분 섭취 트래커 -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-slate-800 flex items-center">
                            <i class="fa-solid fa-droplet text-blue-500 mr-2"></i> 수분 섭취량
                        </h3>
                        <span class="text-sm font-semibold text-blue-600"><span id="water-count">0</span> / 2.0 L</span>
                    </div>
                    <!-- 물방울 아이콘 리스트 (총 8잔 = 2L) -->
                    <div id="water-glasses" class="grid grid-cols-4 gap-2 my-4">
                        <!-- 동적 생성됨 -->
                    </div>
                </div>
                <div class="flex space-x-2 mt-4">
                    <button onclick="addWater(0.25)" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-600 font-semibold py-2 rounded-xl text-sm transition">
                        + 250ml 추가
                    </button>
                    <button onclick="resetWater()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl text-sm transition">
                        초기화
                    </button>
                </div>
            </div>

            <!-- 체중 기록 카드 -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-slate-800 flex items-center">
                            <i class="fa-solid fa-weight-scale text-emerald-500 mr-2"></i> 체중 기록
                        </h3>
                        <span class="text-xs text-slate-400">최근 기록</span>
                    </div>
                    <div class="flex items-baseline space-x-2 mb-4">
                        <span id="current-weight-display" class="text-3xl font-bold text-slate-800">-</span>
                        <span class="text-slate-500 font-medium">kg</span>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <input type="number" id="weight-input" step="0.1" placeholder="오늘 체중 (kg)" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <button onclick="saveWeight()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-5 py-2 rounded-xl text-sm transition shadow-lg shadow-emerald-100">
                        저장
                    </button>
                </div>
            </div>

        </div>

        <!-- 식단 기록 섹션 -->
        <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-slate-800 text-lg flex items-center">
                    <i class="fa-solid fa-utensils text-orange-500 mr-2"></i> 식단 기록
                </h3>
                <button onclick="openMealModal('아침')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-600 font-semibold px-4 py-2 rounded-xl text-sm transition flex items-center">
                    <i class="fa-solid fa-plus mr-1.5"></i> 식단 추가
                </button>
            </div>

            <!-- 식단 카테고리별 목록 -->
            <div class="space-y-4" id="meal-list-container">
                <!-- 아침 -->
                <div class="border border-slate-100 rounded-2xl p-4 bg-slate-50/50">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-semibold text-slate-700 flex items-center text-sm">
                            <i class="fa-solid fa-sun text-amber-500 mr-2"></i> 아침식사
                        </span>
                        <div class="flex items-center space-x-2">
                            <span id="breakfast-total" class="text-xs font-bold text-slate-500">0 kcal</span>
                            <button onclick="openMealModal('아침')" class="text-slate-400 hover:text-emerald-600 text-xs"><i class="fa-solid fa-plus-circle"></i></button>
                        </div>
                    </div>
                    <div id="breakfast-items" class="space-y-2 text-sm">
                        <p class="text-xs text-slate-400 italic">기록된 음식이 없습니다.</p>
                    </div>
                </div>

                <!-- 점심 -->
                <div class="border border-slate-100 rounded-2xl p-4 bg-slate-50/50">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-semibold text-slate-700 flex items-center text-sm">
                            <i class="fa-solid fa-cloud-sun text-orange-400 mr-2"></i> 점심식사
                        </span>
                        <div class="flex items-center space-x-2">
                            <span id="lunch-total" class="text-xs font-bold text-slate-500">0 kcal</span>
                            <button onclick="openMealModal('점심')" class="text-slate-400 hover:text-emerald-600 text-xs"><i class="fa-solid fa-plus-circle"></i></button>
                        </div>
                    </div>
                    <div id="lunch-items" class="space-y-2 text-sm">
                        <p class="text-xs text-slate-400 italic">기록된 음식이 없습니다.</p>
                    </div>
                </div>

                <!-- 저녁 -->
                <div class="border border-slate-100 rounded-2xl p-4 bg-slate-50/50">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-semibold text-slate-700 flex items-center text-sm">
                            <i class="fa-solid fa-moon text-indigo-500 mr-2"></i> 저녁식사
                        </span>
                        <div class="flex items-center space-x-2">
                            <span id="dinner-total" class="text-xs font-bold text-slate-500">0 kcal</span>
                            <button onclick="openMealModal('저녁')" class="text-slate-400 hover:text-emerald-600 text-xs"><i class="fa-solid fa-plus-circle"></i></button>
                        </div>
                    </div>
                    <div id="dinner-items" class="space-y-2 text-sm">
                        <p class="text-xs text-slate-400 italic">기록된 음식이 없습니다.</p>
                    </div>
                </div>

                <!-- 간식 -->
                <div class="border border-slate-100 rounded-2xl p-4 bg-slate-50/50">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-semibold text-slate-700 flex items-center text-sm">
                            <i class="fa-solid fa-cookie-bite text-pink-500 mr-2"></i> 간식 및 기타
                        </span>
                        <div class="flex items-center space-x-2">
                            <span id="snack-total" class="text-xs font-bold text-slate-500">0 kcal</span>
                            <button onclick="openMealModal('간식')" class="text-slate-400 hover:text-emerald-600 text-xs"><i class="fa-solid fa-plus-circle"></i></button>
                        </div>
                    </div>
                    <div id="snack-items" class="space-y-2 text-sm">
                        <p class="text-xs text-slate-400 italic">기록된 음식이 없습니다.</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- 식단 추가 모달 -->
    <div id="meal-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="font-bold text-lg text-slate-800">식단 추가</h3>
                <button onclick="closeMealModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">식사 구분</label>
                    <select id="meal-category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                        <option value="아침">아침</option>
                        <option value="점심">점심</option>
                        <option value="저녁">저녁</option>
                        <option value="간식">간식</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">음식 이름</label>
                    <input type="text" id="food-name" placeholder="예: 닭가슴살 샐러드" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">칼로리 (kcal)</label>
                    <input type="number" id="food-calories" placeholder="예: 350" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="pt-2 flex space-x-2">
                    <button onclick="closeMealModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3 rounded-xl text-sm transition">취소</button>
                    <button onclick="addMealItem()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-100">추가하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 목표 설정 모달 -->
    <div id="goal-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-slate-800">일일 목표 칼로리 설정</h3>
                <button onclick="closeGoalModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">목표 칼로리 (kcal)</label>
                    <input type="number" id="goal-input" placeholder="예: 2000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="pt-2 flex space-x-2">
                    <button onclick="closeGoalModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3 rounded-xl text-sm transition">취소</button>
                    <button onclick="saveGoal()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-100">저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 안내 메시지 박스 커스텀 -->
    <div id="message-box" class="fixed bottom-6 right-6 bg-slate-800 text-white px-5 py-3 rounded-2xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 text-sm font-medium">
        알림 메시지입니다.
    </div>

    <!-- 자바스크립트 로직 -->
    <script>
        // 날짜 표시
        const dateElement = document.getElementById('current-date');
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
        dateElement.textContent = today.toLocaleDateString('ko-KR', options);

        // 앱 상태 데이터
        let appData = {
            goalCalories: 2000,
            water: 0, // 리터 단위 (최대 2.0)
            weight: null,
            meals: {
                아침: [],
                점심: [],
                저녁: [],
                간식: []
            }
        };

        // 로컬 스토리지에서 데이터 불러오기
        function loadData() {
            const saved = localStorage.getItem('slimlife_data');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch (e) {
                    console.error('데이터 파싱 오류', e);
                }
            }
            renderApp();
        }

        // 로컬 스토리지에 데이터 저장
        function saveData() {
            localStorage.setItem('slimlife_data', JSON.stringify(appData));
        }

        // UI 렌더링 함수
        function renderApp() {
            // 목표 칼로리 반영
            document.getElementById('goal-calories').textContent = appData.goalCalories;
            document.getElementById('stat-goal').textContent = appData.goalCalories;

            // 체중 반영
            document.getElementById('current-weight-display').textContent = appData.weight !== null ? appData.weight : '-';
            if (appData.weight !== null) {
                document.getElementById('weight-input').value = appData.weight;
            }

            // 물 섭취 반영
            document.getElementById('water-count').textContent = appData.water.toFixed(2);
            renderWaterGlasses();

            // 식단 및 총 섭취 칼로리 계산
            let totalConsumed = 0;
            const categories = ['아침', '점심', '저녁', '간식'];
            
            categories.forEach(cat => {
                let catTotal = 0;
                const containerId = cat === '아침' ? 'breakfast-items' :
                                    cat === '점심' ? 'lunch-items' :
                                    cat === '저녁' ? 'dinner-items' : 'snack-items';
                const totalId = cat === '아침' ? 'breakfast-total' :
                                cat === '점심' ? 'lunch-total' :
                                cat === '저녁' ? 'dinner-total' : 'snack-total';

                const itemsContainer = document.getElementById(containerId);
                itemsContainer.innerHTML = '';

                if (appData.meals[cat].length === 0) {
                    itemsContainer.innerHTML = `<p class="text-xs text-slate-400 italic">기록된 음식이 없습니다.</p>`;
                } else {
                    appData.meals[cat].forEach((item, index) => {
                        catTotal += Number(item.calories);
                        const itemEl = document.createElement('div');
                        itemEl.className = 'flex justify-between items-center bg-white p-2.5 rounded-xl border border-slate-100 shadow-2xs';
                        itemEl.innerHTML = `
                            <span class="font-medium text-slate-700">${item.name}</span>
                            <div class="flex items-center space-x-3">
                                <span class="text-xs font-semibold text-emerald-600">${item.calories} kcal</span>
                                <button onclick="deleteMealItem('${cat}', ${index})" class="text-slate-300 hover:text-rose-500 text-xs">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        `;
                        itemsContainer.appendChild(itemEl);
                    });
                }

                document.getElementById(totalId).textContent = `${catTotal} kcal`;
                totalConsumed += catTotal;
            });

            // 전체 요약 반영
            document.getElementById('total-consumed').textContent = totalConsumed;
            document.getElementById('stat-consumed').textContent = totalConsumed;

            const remaining = appData.goalCalories - totalConsumed;
            const remainingEl = document.getElementById('stat-remaining');
            remainingEl.textContent = remaining;
            if (remaining < 0) {
                remainingEl.className = 'font-bold text-lg text-rose-200';
            } else {
                remainingEl.className = 'font-bold text-lg';
            }

            // 프로그레스 바 계산
            let percentage = (totalConsumed / appData.goalCalories) * 100;
            if (percentage > 100) percentage = 100;
            document.getElementById('calorie-progress').style.width = `${percentage}%`;
        }

        // 물 섭취 시각화 (총 8잔 렌더링)
        function renderWaterGlasses() {
            const container = document.getElementById('water-glasses');
            container.innerHTML = '';
            
            // 0.25L 단위로 총 8잔 (2.0L 기준)
            const totalGlasses = 8;
            const filledGlasses = Math.round(appData.water / 0.25);

            for (let i = 1; i <= totalGlasses; i++) {
                const isFilled = i <= filledGlasses;
                const glassBtn = document.createElement('button');
                glassBtn.onclick = () => setWaterByGlass(i * 0.25);
                glassBtn.className = `h-10 rounded-xl flex items-center justify-center transition border ${
                    isFilled 
                        ? 'bg-blue-500 border-blue-500 text-white shadow-md shadow-blue-100' 
                        : 'bg-blue-50/50 border-blue-100 text-blue-300 hover:bg-blue-100'
                }`;
                glassBtn.innerHTML = `<i class="fa-solid fa-glass-water text-sm"></i>`;
                container.appendChild(glassBtn);
            }
        }

        function addWater(amount) {
            appData.water = Math.min(4.0, appData.water + amount);
            saveData();
            renderApp();
            showToast('수분이 추가되었습니다.');
        }

        function setWaterByGlass(amount) {
            appData.water = amount;
            saveData();
            renderApp();
        }

        function resetWater() {
            appData.water = 0;
            saveData();
            renderApp();
            showToast('수분 기록이 초기화되었습니다.');
        }

        // 체중 저장
        function saveWeight() {
            const inputVal = document.getElementById('weight-input').value;
            if (!inputVal || isNaN(inputVal)) {
                showToast('올바른 체중을 입력해주세요.');
                return;
            }
            appData.weight = parseFloat(inputVal);
            saveData();
            renderApp();
            showToast('체중이 기록되었습니다.');
        }

        // 식단 모달 제어
        function openMealModal(defaultCategory = '아침') {
            document.getElementById('meal-category').value = defaultCategory;
            document.getElementById('food-name').value = '';
            document.getElementById('food-calories').value = '';
            document.getElementById('meal-modal').classList.remove('hidden');
        }

        function closeMealModal() {
            document.getElementById('meal-modal').classList.add('hidden');
        }

        function addMealItem() {
            const category = document.getElementById('meal-category').value;
            const name = document.getElementById('food-name').value.trim();
            const calories = document.getElementById('food-calories').value;

            if (!name) {
                showToast('음식 이름을 입력해주세요.');
                return;
            }
            if (!calories || isNaN(calories) || calories < 0) {
                showToast('올바른 칼로리를 입력해주세요.');
                return;
            }

            appData.meals[category].push({ name, calories: Number(calories) });
            saveData();
            renderApp();
            closeMealModal();
            showToast('식단이 추가되었습니다.');
        }

        function deleteMealItem(category, index) {
            appData.meals[category].splice(index, 1);
            saveData();
            renderApp();
            showToast('식단이 삭제되었습니다.');
        }

        // 목표 칼로리 모달 제어
        function openGoalModal() {
            document.getElementById('goal-input').value = appData.goalCalories;
            document.getElementById('goal-modal').classList.remove('hidden');
        }

        function closeGoalModal() {
            document.getElementById('goal-modal').classList.add('hidden');
        }

        function saveGoal() {
            const goalVal = document.getElementById('goal-input').value;
            if (!goalVal || isNaN(goalVal) || goalVal <= 0) {
                showToast('올바른 목표 칼로리를 입력해주세요.');
                return;
            }
            appData.goalCalories = parseInt(goalVal);
            saveData();
            renderApp();
            closeGoalModal();
            showToast('목표 칼로리가 변경되었습니다.');
        }

        // 전체 데이터 초기화
        function resetData() {
            if (confirm('오늘의 모든 기록을 초기화하시겠습니까?')) {
                localStorage.removeItem('slimlife_data');
                appData = {
                    goalCalories: 2000,
                    water: 0,
                    weight: null,
                    meals: { 아침: [], 점심: [], 저녁: [], 간식: [] }
                };
                renderApp();
                showToast('모든 기록이 초기화되었습니다.');
            }
        }

        // 알림 토스트 메시지 함수 (alert 대신 사용)
        function showToast(message) {
            const toast = document.getElementById('message-box');
            toast.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // 초기 실행
        window.onload = function() {
            loadData();
        };
    </script>
</body>
</html>
