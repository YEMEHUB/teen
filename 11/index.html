    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #2e1065, #0f172a 60%, #090d16 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 네온 유리 질감 카드 */
        .neon-card {
            background: rgba(30, 41, 59, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(192, 132, 252, 0.25);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(168, 85, 247, 0.15);
        }

        /* 초성 글자 타일 스타일 */
        .chosung-tile {
            background: linear-gradient(145deg, #1e1b4b, #311042);
            border: 2px solid #a855f7;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.2);
            text-shadow: 0 0 15px rgba(232, 121, 249, 0.8);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

</head>

                    </button>
                    <button type="button" data-filter="GIRL" class="filter-option py-2 px-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:border-fuchsia-500 transition">
                        💃 걸그룹

        function playTone(type) {
            try {
                if (!synth && typeof Tone !== 'undefined') {
                    synth = new Tone.PolySynth(Tone.Synth).toDestination();
                    synth.volume.value = -8;
                }
                if (!synth) return;
                if (Tone.context.state !== 'running') Tone.start();

                const now = Tone.now();
                if (type === 'correct') {
                    synth.triggerAttackRelease("C5", "16n", now);
                    synth.triggerAttackRelease("E5", "16n", now + 0.09);
                    synth.triggerAttackRelease("G5", "16n", now + 0.18);
                    synth.triggerAttackRelease("C6", "8n", now + 0.27);
                } else if (type === 'wrong') {
                    synth.triggerAttackRelease("C3", "8n", now);
                    synth.triggerAttackRelease("B2", "4n", now + 0.12);
                } else if (type === 'hint') {
                    synth.triggerAttackRelease("G5", "32n", now);
                }
            } catch (e) {
                // 오디오 차단 환경 무시
            }

        function startQuiz() {
            let filtered = IDOL_GROUPS;
            if (selectedFilter !== 'ALL') {
                filtered = IDOL_GROUPS.filter(g => g.type === selectedFilter);
            }

            // 문제 제한 없이 출제 풀을 랜덤 셔플(소진 시 다시 섞어서 무한 제공)
            quizList = shuffleArray(filtered);
            currentIndex = 0;
            score = 0;
            correctCount = 0;
            wrongCount = 0;
            userHistory = [];

            scoreDisplay.textContent = '0';
            updateLivesUI();
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            loadQuestion();
        }

        // --- 문제 로드 ---
        function loadQuestion() {
            clearInterval(timerInterval);
            isAnswered = false;
            hintUsed = false;

            // 준비된 출제 풀을 모두 풀었을 경우 다시 셔플하여 이어서 출제
            if (currentIndex >= quizList.length) {
                let filtered = IDOL_GROUPS;
                if (selectedFilter !== 'ALL') {
                    filtered = IDOL_GROUPS.filter(g => g.type === selectedFilter);
                }
                quizList = shuffleArray(filtered);
                currentIndex = 0;
            }

            const current = quizList[currentIndex];
            const questionNumber = userHistory.length + 1;

            // UI 초기화
            questionCounter.textContent = `${questionNumber}번째 문제`;
            groupBadge.textContent = current.label;
            feedbackOverlay.classList.add('hidden');
            hintBox.classList.add('hidden');
            answerForm.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            answerInput.value = '';
            answerInput.disabled = false;

            // 글자 수에 따라 초성 타일 크기 동적 조절
            const len = current.chosung.length;
            const tileSizeClass = len >= 7
                ? 'w-9 h-11 text-xl sm:w-10 sm:h-12 sm:text-2xl'
                : 'w-12 h-14 text-2xl sm:w-14 sm:h-16 sm:text-3xl';

            chosungContainer.innerHTML = current.chosung.map((char, idx) => `
                <div class="chosung-tile ${tileSizeClass} rounded-xl flex items-center justify-center font-black text-white animate-pop" style="animation-delay: ${idx * 40}ms">
                    ${char}
                </div>
            `).join('');

            letterCountInfo.textContent = `총 ${len}글자`;

            startQuestionTimer();
            setTimeout(() => answerInput.focus(), 50);
        }

        // --- 타이머 작동 ---
        function startQuestionTimer() {
            clearInterval(timerInterval);
            if (timeLimit === 0) {
                timerContainer.classList.add('hidden');
                return;
            }

            timerContainer.classList.remove('hidden');
            timeLeft = timeLimit * 10;
            const totalTicks = timeLeft;
            timerBar.style.width = '100%';

            timerInterval = setInterval(() => {
                if (isAnswered) {
                    clearInterval(timerInterval);
                    return;
                }

                timeLeft -= 1;
                const pct = Math.max(0, (timeLeft / totalTicks) * 100);
                timerBar.style.width = `${pct}%`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    evaluateAnswer('', true);
                }
            }, 100);
        }

        // --- 대표곡 힌트 보기 ---
        hintBtn.addEventListener('click', () => {
            if (isAnswered || hintUsed) return;
            hintUsed = true;
            playTone('hint');
            const current = quizList[currentIndex];
            hintText.textContent = `💡 힌트: ${current.songs}`;
            hintBox.classList.remove('hidden');
            answerInput.focus();
        });

        // --- 정답 제출 ---
        answerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (isAnswered) return;
            const userVal = answerInput.value.trim();
            if (!userVal) {
                answerInput.classList.add('animate-shake');
                setTimeout(() => answerInput.classList.remove('animate-shake'), 400);
                return;
            }
            evaluateAnswer(userVal, false);
        });

        // --- 정답 판정 로직 (공백/특수문자 제거 후 비교) ---
        function normalizeText(str) {
            return str.replace(/[\s\-\(\)·]/g, '').toLowerCase();
        }

        function evaluateAnswer(userInput, isTimeout) {
            isAnswered = true;
            clearInterval(timerInterval);
            answerInput.disabled = true;

            const current = quizList[currentIndex];
            const cleanInput = normalizeText(userInput);
            const validAnswers = [current.name, ...(current.aliases || [])].map(normalizeText);

            const isCorrect = !isTimeout && validAnswers.includes(cleanInput);

            if (isCorrect) {
                playTone('correct');
                correctCount++;
                const earned = hintUsed ? 50 : 100;
                score += earned;
                scoreDisplay.textContent = score;

                feedbackIcon.textContent = '⭕';
                feedbackTitle.textContent = `정답입니다! (+${earned}점)`;
                feedbackTitle.className = 'text-xl font-black text-emerald-400 mb-1';
            } else {
                playTone('wrong');
                wrongCount++;
                updateLivesUI();
                feedbackIcon.textContent = isTimeout ? '⏰' : '❌';
                feedbackTitle.textContent = isTimeout
                    ? `시간 초과! 땡! (${wrongCount}/${MAX_LIVES} 오답)`
                    : `아쉽습니다! 땡! (${wrongCount}/${MAX_LIVES} 오답)`;
                feedbackTitle.className = 'text-xl font-black text-rose-400 mb-1';
                quizScreen.classList.add('animate-shake');
                setTimeout(() => quizScreen.classList.remove('animate-shake'), 400);
            }

            const engAlias = current.aliases && current.aliases[0] ? ` (${current.aliases[0]})` : '';
            feedbackAnswer.textContent = `${current.name}${engAlias}`;
            feedbackDesc.textContent = current.desc;

            userHistory.push({
                name: current.name,
                chosung: current.chosung.join(''),
                userAnswer: isTimeout ? '시간 초과' : userInput,
                isCorrect
            });

            const isGameOver = wrongCount >= MAX_LIVES;
            feedbackOverlay.classList.remove('hidden');
            answerForm.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            nextBtn.textContent = isGameOver ? '3번 틀렸어요! 결과 보기 💀' : '다음 문제로 ➔';
            nextBtn.focus();
        }

        // --- 다음 문제 이동 ---
        nextBtn.addEventListener('click', () => {
            if (wrongCount >= MAX_LIVES) {
                showFinalResults();
                return;
            }
            currentIndex++;
            loadQuestion();
        });

        // --- 최종 결과 화면 출력 ---
        function showFinalResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('animate-pop');

            finalCorrect.textContent = correctCount;
            finalScore.textContent = score;

            if (correctCount >= 20) {
                resultComment.textContent = "미쳤습니다! 오답 3번을 버텨낸 진짜 K-POP 레전드! 👑";
            } else if (correctCount >= 10) {
                resultComment.textContent = "멋져요! 두 자릿수 연속 정답을 달성하셨네요! 🔥";
            } else if (correctCount >= 5) {
                resultComment.textContent = "꽤 선전하셨어요! 다음엔 더 오래 살아남아 봅시다! 👏";
            } else {
                resultComment.textContent = "아쉽지만 3번의 기회가 모두 소진됐어요! 다시 도전해 보세요! 💪";
            }

            reviewList.innerHTML = userHistory.map((item, idx) => `
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-800/80 border border-slate-700/60 text-xs">
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-slate-400">${idx + 1}.</span>
                        <span class="px-1.5 py-0.5 rounded bg-indigo-950 text-fuchsia-300 font-bold text-[11px]">${item.chosung}</span>
                        <span class="font-extrabold text-white">${item.name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        ${item.isCorrect
                            ? '<span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold">정답</span>'
                            : `<span class="text-slate-400 line-through">${item.userAnswer}</span> <span class="px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 font-bold">오답</span>`
                        }
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
